<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crafted Editions</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/page-flip/dist/css/page-flip.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://use.typekit.net/euz1cgo.css">

<style>
* { box-sizing: border-box; }

@font-face {
  font-family: "TestFont";
  src: url("./fonts/OPSCubic-Regular.otf") format("opentype");
}

/* ===== GLOBAL ===== */

html, body {
  margin: 0;
  padding: 0;
  background: white;
  color: #111;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: hidden;
}

/* ===== INTRO ===== */

#intro {
  position: fixed;
  inset: 0;
  background: white;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.container {
  max-width: 1400px;
  width: 100%;
  padding: 3.5rem 1.25rem 1rem;
}

/* ===== TYPO ===== */

h1 {
  font-family: "quinn-text", serif;
  font-style: italic;
  font-weight: 400;
  font-size: clamp(44px, 4vw, 60px);
  margin: 0 0 14px;
  letter-spacing: -0.015em;
  text-align: left;
  margin-left: -0.15rem;
}

#intro p {
  font-family: TestFont;
  font-size: clamp(13.5px, 1.4vw, 18px);
  line-height: 1.45;
  max-width: 38ch;
  margin: 0 0 70px;
  text-align: left;
  hyphens: manual;
  overflow-wrap: break-word;
  letter-spacing: -0.02em;
  padding-left: 0rem;
}

/* ===== LAYOUT ===== */

.intro-layout {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

/* Desktop */
@media (min-width: 901px) {
  .intro-layout {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 10rem;
    align-items: center;
    text-align: left;
    position: relative;
  }

  .intro-text {
    margin-top: 50px;
    padding-right: 1.5rem;
  }

  #intro p {
    max-width: 42ch;
    line-height: 1.6;
    margin-bottom: 110px;
    border-left: 1px solid rgba(0,0,0,0.08);
    padding-left: 1.5rem;
  }

  .intro-cover {
    padding-left: 2rem;
    text-align: right;
    margin-top: 0px;
  }

  .intro-layout::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 12%;
    transform: translateX(-50%);
    height: 76%;
    width: 1px;
    background: linear-gradient(
      to bottom,
      transparent,
      rgba(0,0,0,0.12),
      transparent
    );
  }
}

/* ===== COVER ===== */

.cover-image {
  display: block;
  width: 100%;
  max-width: 280px;
  margin: 0 auto;
  border-radius: 0;
  box-shadow: 0 10px 25px rgba(0,0,0,.15);
  cursor: pointer;
  transition: transform .35s ease, box-shadow .35s ease;
}

.cover-image:hover {
  transform: translateY(-1px);
  box-shadow:
    0 16px 36px rgba(0,0,0,.2),
    0 8px 22px rgba(242,214,209,.28);
}

@media (min-width: 901px) {
  .cover-image {
    max-width: 560px;
    margin: 0;
  }
}

/* ===== RULER ===== */

.ruler {
  position: fixed;
  left: 0;
  width: 100vw;
  height: 6px;
  background: repeating-linear-gradient(
    to right,
    rgba(0,0,0,0.18) 0,
    rgba(0,0,0,0.18) 1px,
    transparent 1px,
    transparent 28px
  );
  pointer-events: none;
  z-index: 50;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.9s cubic-bezier(.4,0,.2,1),
              transform 0.9s cubic-bezier(.4,0,.2,1);
}

.ruler.top { top: 10px; }
.ruler.bottom { bottom: -0px; }

body.ready .ruler {
  opacity: 0.65;
  transform: translateY(0);
}

/* ===== KATALOG ===== */

.catalogue {
  display: none;
  position: fixed;
  inset: 0;
  background: #111;
}

.catalogue.visible { display: block; }

.desktop-book {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100%;
  overflow: hidden;
}

.book-wrapper {
  position: relative;
  width: min(94vw, 1050px);
  aspect-ratio: 1400 / 1960;
  filter: drop-shadow(0 14px 26px rgba(0,0,0,.14));
  box-shadow: none;
  margin: 0 auto;     /* ← tvingar mitten */
}

#book {
  width: 100%;
  height: 100%;
}

/* Klickzoner */

.click-zones {
  position: absolute;
  inset: 0;
  display: flex;
  z-index: 10;
}

.click-zone { flex: 1; }

#closeCatalogue {
  position: fixed;
  top: 16px;
  right: 16px;
  font-size: 28px;
  border: none;
  background: none;
  cursor: pointer;
  opacity: .7;
  display: none;
  z-index: 999;
  color: #F2D6D1;
}

.progress-container {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: rgba(255,255,255,0.12);
  z-index: 2000;
  display: none;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #F4DDD8, #F2D6D1);
  transition: width .4s cubic-bezier(.4,0,.2,1);
  box-shadow: 0 0 10px rgba(242,214,209,.35);
}

@media (max-width: 800px) {

  .book-wrapper {
    width: 100vw;
    max-width: 380px; /* samma som JS width */
    margin: 0 auto;
  }

  .book-wrapper.cover-mode {
  display: flex;
  align-items: center;
  justify-content: center;
  aspect-ratio: auto;
}

  /* tryck upp cover-bilden lite */
  .intro-cover {
    margin-top: -20px;
  }

}

</style>
</head>

<body>

<div class="ruler top"></div>
<div class="ruler bottom"></div>

<button id="closeCatalogue">✕</button>

<div id="intro">
  <div class="container">
    <div class="intro-layout">

      <div class="intro-text">
        <h1>Crafted Editions</h1>
        <p>I Crafted Edition presenteras arbeten av 13 avgångsstudenter &shy; från Malmstens. Här möts design, material och hantverk i en samlad utställning. Välkommen!</p>
      </div>

      <div class="intro-cover">
        <img src="images/pages/cover.png" alt="Öppna katalog" id="openCatalogue" class="cover-image">
      </div>

    </div>
  </div>
</div>

<section class="catalogue" id="catalogue">
  <div class="desktop-book">
    <div class="book-wrapper">
      <div id="book"></div>

      <div class="click-zones">
        <div class="click-zone" id="prevZone"></div>
        <div class="click-zone" id="nextZone"></div>
      </div>
    </div>
  </div>
</section>

<div class="progress-container" id="progressContainer">
  <div class="progress-bar" id="progressBar"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  requestAnimationFrame(() => {
    document.body.classList.add("ready");
  });

  const openBtn = document.getElementById("openCatalogue");
  const closeBtn = document.getElementById("closeCatalogue");
  const intro = document.getElementById("intro");
  const catalogue = document.getElementById("catalogue");
  const bookEl = document.getElementById("book");
  const prevZone = document.getElementById("prevZone");
  const nextZone = document.getElementById("nextZone");
  const progressContainer = document.getElementById("progressContainer");
  const progressBar = document.getElementById("progressBar");

  let pageFlip = null;

  function lockScroll() {
    document.body.style.position = "fixed";
    document.body.style.width = "100%";
  }

  function unlockScroll() {
    document.body.style.position = "";
    document.body.style.width = "";
  }

  lockScroll();

  function showCatalogue() {
    intro.style.display = "none";
    catalogue.classList.add("visible");
    closeBtn.style.display = "block";
    progressContainer.style.display = "block";
    unlockScroll();
    initBook();
  }

  function hideCatalogue() {
    intro.style.display = "block";
    catalogue.classList.remove("visible");
    closeBtn.style.display = "none";
    progressContainer.style.display = "none";
    progressBar.style.width = "0%";
    bookEl.innerHTML = "";
    pageFlip = null;
    lockScroll();
  }

  openBtn.addEventListener("click", showCatalogue);
  closeBtn.addEventListener("click", hideCatalogue);

  function initBook() {
    if (pageFlip) return;

    const isMobile = window.innerWidth <= 800;

    /* ===== COVER ENDAST MOBIL ===== */
    if (isMobile) {
      const coverPage = document.createElement("div");
      coverPage.className = "page";

      const coverImg = document.createElement("img");
      coverImg.src = "images/pages/cover.png";
      coverImg.style.width = "100%";
      coverImg.style.height = "100%";
      coverImg.style.objectFit = "contain";
      coverImg.style.background = "#fff";

      coverPage.appendChild(coverImg);
      bookEl.appendChild(coverPage);
    }

    /* ===== RIKTIGA SIDOR ===== */
    for (let i = 1; i <= 45; i++) {
      const page = document.createElement("div");
      page.className = "page";

      const img = document.createElement("img");
      img.src = `images/pages/page-${String(i).padStart(2,'0')}.png`;
      img.style.width = "100%";
      img.style.height = "100%";
      img.style.objectFit = "contain";
      img.style.background = "#fff";

      page.appendChild(img);
      bookEl.appendChild(page);
    }

    /* ===== BLANK SISTA SIDA – ENDAST DESKTOP ===== */
    if (!isMobile) {
      const blankPage = document.createElement("div");
      blankPage.className = "page";
      blankPage.style.background = "#111"; // samma som catalogue-bg
      blankPage.style.width = "100%";
      blankPage.style.height = "100%";
      bookEl.appendChild(blankPage);
    }

    pageFlip = new St.PageFlip(bookEl, {
      width: isMobile ? 380 : 700,
      height: isMobile ? 532 : 980,

      size: isMobile ? "fixed" : "stretch",
      autoSize: !isMobile,

      showCover: false,
      drawShadow: false,
      
      mobileScrollSupport: false,
      showPageCorners: false,
      maxShadowOpacity: 0.1
    });

    pageFlip.loadFromHTML(bookEl.querySelectorAll(".page"));

    /* ===== STARTPOSITION ===== */
    setTimeout(() => {
      if (isMobile) {
        pageFlip.flip(0); // cover
      } else {
        pageFlip.flip(1); // första uppslag
      }
    }, 0);

    updateProgress();
    pageFlip.on("flip", updateProgress);
  }

  function updateProgress() {
    const current = pageFlip.getCurrentPageIndex() + 1;
    const total = pageFlip.getPageCount();
    progressBar.style.width = (current / total * 100) + "%";
  }

  prevZone.addEventListener("click", () => pageFlip?.flipPrev());
  nextZone.addEventListener("click", () => pageFlip?.flipNext());

});
</script>


</body>
</html>
